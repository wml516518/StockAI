# Python数据服务配置模板
# 复制为 config.ini 后填写本机或服务器上的真实值。
# config.ini 已被 Git 忽略，不能提交任何真实 Token。

[TuShare]
# TuShare API Token (从 https://tushare.pro/register 注册获取)
# 留空则跳过TuShare数据源
Token =

[DataSources]
# 数据源优先级 (逗号分隔)
# 可选值: AKShare, EastMoney, TuShare
Priority = AKShare,EastMoney,TuShare

[Network]
# 请求超时时间（秒）
Timeout = 10

# 重试次数
MaxRetries = 2
