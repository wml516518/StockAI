# Python数据服务配置文件
# 请根据实际情况修改以下配置

[TuShare]
# TuShare API Token (从 https://tushare.pro/register 注册获取)
# 配置后可以使用TuShare作为稳定的数据源
# 留空则跳过TuShare数据源
Token = 5f6a876f648046b5c7278c8064b3622e80e8c56e24cb61a67492625c

[DataSources]
# 数据源优先级 (逗号分隔)
# 可选值: AKShare, EastMoney, TuShare
Priority = AKShare,EastMoney,TuShare

[Network]
# 请求超时时间（秒）
Timeout = 10

# 重试次数
MaxRetries = 2
