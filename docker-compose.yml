services:
  # 后端API服务
  backend:
    build:
      context: .
      dockerfile: src/StockAnalyse.Api/Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/stockanalyse.db
      - PYTHON_DATA_SERVICE_URL=http://python-service:5001
      - APP_AUTH_USERNAME=${APP_AUTH_USERNAME:-admin}
      - APP_AUTH_PASSWORD=${APP_AUTH_PASSWORD:-StockAI@2026}
      - TZ=Asia/Shanghai
    volumes:
      - stock-data:/app/data
      - stock-backend-logs:/app/logs
    networks:
      - stock-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    depends_on:
      python-service:
        condition: service_healthy

  # Python数据服务
  python-service:
    build:
      context: ./python-data-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - type: bind
        source: ./python-data-service/config.ini
        target: /app/config.ini
        read_only: true
        bind:
          create_host_path: false
      - stock-python-logs:/app/logs
    networks:
      - stock-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # 前端Nginx服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-18081}:80"
    environment:
      - TZ=Asia/Shanghai
    networks:
      - stock-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      backend:
        condition: service_healthy

networks:
  stock-network:
    driver: bridge

volumes:
  stock-data:
  stock-backend-logs:
  stock-python-logs:
